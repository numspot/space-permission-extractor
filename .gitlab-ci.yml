stages:
  - test
  - release

variables:
  GO_VERSION: "1.21"

test:
  stage: test
  image: golang:${GO_VERSION}
  script:
    - go test ./...
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

lint:
  stage: test
  image: golang:${GO_VERSION}
  before_script:
    - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
  script:
    - golangci-lint run ./...
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID

release:
  stage: release
  image: goreleaser/goreleaser:v2
  variables:
    GIT_DEPTH: 0
  before_script:
    - |
      # Ensure we have a token for GitLab API
      if [ -z "$GITLAB_TOKEN" ]; then
        echo "WARNING: GITLAB_TOKEN not set. Trying CI_JOB_TOKEN..."
        if [ -n "$CI_JOB_TOKEN" ]; then
          export GITLAB_TOKEN="$CI_JOB_TOKEN"
          echo "Using CI_JOB_TOKEN for release"
        else
          echo "ERROR: No token available. Set GITLAB_TOKEN in CI/CD variables."
          exit 1
        fi
      fi
  script:
    - goreleaser release --clean
  rules:
    - if: $CI_COMMIT_TAG
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
